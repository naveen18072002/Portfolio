<aside class="sidebar" [class.active]="isOpen()">

  <div class="sidebar-info">

    <figure class="avatar-box" *ngIf="profile().avatarUrl">
      <img [src]="profile().avatarUrl" [alt]="profile().name" width="100">
      <span class="avatar-status-dot" *ngIf="profile().name && profile().availableForWork !== false" title="Available for Work"></span>
    </figure>

    <div class="info-content">
      <h1 class="name" [title]="profile().name">{{ profile().name }}</h1>
      <div
        class="typewriter-badge"
        [ngClass]="currentRoleTheme()"
        [class.completed]="isWordComplete()"
        *ngIf="dynamicRoles().length > 0"
        (mouseenter)="pauseTypewriter()"
        (mouseleave)="resumeTypewriter()"
        (click)="skipToNextRole($event)"
        title="Click to cycle next role"
      >
        
        <ion-icon [name]="currentRoleIcon()" class="role-badge-icon"></ion-icon>
        <span class="typing-text">{{ typedTitle() }}</span>
        <span class="typing-cursor"></span>
      </div>
      <div class="status-indicator-pill" *ngIf="profile().name && profile().availableForWork !== false">
        <span class="status-radar-core"></span>
        <span class="status-text">Available for work</span>
      </div>
    </div>

    <button class="info_more-btn" (click)="toggle()">
      <span>Show Contacts</span>
      <ion-icon name="chevron-down"></ion-icon>
    </button>

  </div>

  <div class="sidebar-info_more">

    <div class="separator"></div>

    <ul class="contacts-list">

      <li class="contact-item" *ngFor="let contact of contacts">
        <div class="icon-box">
          <ion-icon [name]="contact.icon"></ion-icon>
        </div>
        <div class="contact-info">
          <p class="contact-title">{{ contact.title }}</p>
          <a *ngIf="contact.type === 'link'" [href]="contact.href" class="contact-link">{{ contact.value }}</a>
          <time *ngIf="contact.type === 'time'" [attr.datetime]="contact.datetime">{{ contact.value }}</time>
          <address *ngIf="contact.type === 'address'">{{ contact.value }}</address>
        </div>
      </li>

    </ul>

    <div class="separator"></div>

    <ul class="social-list">
      <li class="social-item" *ngFor="let social of socials">
        <a
          [href]="social.url"
          target="_blank"
          rel="noopener noreferrer"
          class="social-link"
          [attr.aria-label]="social.name">

          <ion-icon
            [name]="social.icon"
            [ngClass]="social.name.toLowerCase()">
          </ion-icon>

        </a>
      </li>
    </ul>

  </div>

</aside>
