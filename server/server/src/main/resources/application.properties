# Application Name & Server Port
spring.application.name=portfolio-backend
server.port=8080

# Oracle Database Configuration
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XE
spring.datasource.username=system
spring.datasource.password=SYS
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA & Hibernate Settings for Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Token Configuration
app.jwt.secret=PortfolioSecretKeyForJwtTokenAuthenticationMustBe256BitsLongMinimum1234567890
app.jwt.expiration-ms=86400000

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:4200,http://localhost:8080

