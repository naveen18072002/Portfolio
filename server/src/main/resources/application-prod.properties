# ==========================================
# PRODUCTION ENVIRONMENT
# PostgreSQL / Supabase Optimization
# ==========================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA & Hibernate Performance Settings for Supabase PostgreSQL
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# HikariCP Cloud DB Stability, Connection Pooling & Speed
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-query=SELECT 1
spring.datasource.hikari.pool-name=SupabaseHikariCP

# GZIP Response Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Open Hibernate Session in View - Disable for performance
spring.jpa.open-in-view=false
