# Application Name & Server Port
spring.application.name=portfolio-backend
server.port=${PORT:8080}
# Active Profile: 'local' (MySQL) for localhost development, 'prod' (PostgreSQL) for production cloud
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# Connection Pool & Driver Startup Resilience
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-query=SELECT 1

# HTTP Payload & File Upload Limits (supports large base64 image strings)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-swallow-size=20MB
server.tomcat.max-http-form-post-size=20MB

# JWT Token Configuration
app.jwt.secret=${JWT_SECRET:PortfolioSecretKeyForJwtTokenAuthenticationMustBe256BitsLongMinimum1234567890}
app.jwt.expiration-ms=7200000

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080,https://naveen-portfolio.liveserver.workers.dev}

# Spring Mail (Gmail SMTP SSL)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3

# GZIP Response Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024
