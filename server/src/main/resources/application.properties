# Application Name & Server Port
spring.application.name=portfolio-backend
server.port=${PORT:8080}

# MySQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HTTP Payload & File Upload Limits (supports large base64 image strings)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-swallow-size=20MB
server.tomcat.max-http-form-post-size=20MB

# JWT Token Configuration
app.jwt.secret=PortfolioSecretKeyForJwtTokenAuthenticationMustBe256BitsLongMinimum1234567890
app.jwt.expiration-ms=7200000

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:4200,http://localhost:8080,https://naveen-portfolio.liveserver.workers.dev

# Spring Mail (Gmail SMTP SSL)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
